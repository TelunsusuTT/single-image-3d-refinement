[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hy3dpaint-finetune"
version = "0.1.0"
description = "Controlled Hunyuan3D 2.1 Paint-stage adaptation and inference experiments"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "Pillow>=9",
]

[project.optional-dependencies]
config = ["omegaconf>=2.3"]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# PyTorch, PyTorch Lightning, CUDA, Blender, and Hunyuan3D are supplied by the
# matching upstream runtime environment and are intentionally not pinned here.
