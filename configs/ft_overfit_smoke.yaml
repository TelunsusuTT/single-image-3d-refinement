model:
  base_learning_rate: 5.0e-05
  target: hunyuanpaintpbr.HunyuanPaint
  params:
    num_view: 6
    view_size: 512
    drop_cond_prob: 0.1
    noise_in_channels: 12
    stable_diffusion_config:
      pretrained_model_name_or_path: sd2-community/stable-diffusion-2-1
      custom_pipeline: ./hunyuanpaintpbr
data:
  target: src.data.objaverse_hunyuan.DataModuleFromConfig
  params:
    batch_size: 1
    num_workers: 1
    train:
    - target: src.data.dataloader.objaverse_loader_forTexturePBR.TextureDataset
      params:
        num_view: 6
        json_path: /vol/bitbucket/ct1022/hy3dpaint_finetune/data/hy3dpaint_train_examples/official_overfit/examples.json
    validation:
    - target: src.data.dataloader.objaverse_loader_forTexturePBR.TextureDataset
      params:
        num_view: 6
        json_path: /vol/bitbucket/ct1022/hy3dpaint_finetune/data/hy3dpaint_train_examples/official_overfit/examples.json
lightning:
  modelcheckpoint:
    params:
      every_n_train_steps: 1000000
      save_top_k: 0
      save_last: false
  callbacks: {}
  trainer:
    benchmark: true
    max_epochs: -1
    gradient_clip_val: 1.0
    val_check_interval: 1000
    num_sanity_val_steps: 0
    accumulate_grad_batches: 1
    check_val_every_n_epoch: null
    max_steps: 50
    limit_val_batches: 0
init_control_from: null
resume_from: null
