model:
  base_learning_rate: 1e-6
  target: hunyuanpaintpbr.HunyuanPaint
  params:
    num_view: 6
    view_size: 512
    drop_cond_prob: 0.1
    noise_in_channels: 12
    stable_diffusion_config:
      pretrained_model_name_or_path: /vol/bitbucket/ct1022/hy3dpaint_finetune/caches/hf/hub/models--tencent--Hunyuan3D-2.1/snapshots/0b94677654c57bb9a6b6845cd7b704ccf551d327/hunyuan3d-paintpbr-v2-1
      custom_pipeline: ./hunyuanpaintpbr
data:
  target: src.data.objaverse_hunyuan.DataModuleFromConfig
  params:
    batch_size: 1
    num_workers: 1
    train:
    - target: src.data.dataloader.objaverse_loader_forTexturePBR.TextureDataset
      params:
        num_view: 6
        json_path: /vol/bitbucket/ct1022/hy3dpaint_finetune/data/hy3dpaint_train_examples/pilot_v1/examples_train_abs.json
    validation:
    - target: src.data.dataloader.objaverse_loader_forTexturePBR.TextureDataset
      params:
        num_view: 6
        json_path: /vol/bitbucket/ct1022/hy3dpaint_finetune/data/hy3dpaint_train_examples/pilot_v1/examples_train_abs.json
lightning:
  modelcheckpoint:
    params:
      dirpath: /vol/bitbucket/ct1022/hy3dpaint_finetune/checkpoints/pilot_v1_truepbr_50_lr1e6
      filename: pilot_v1_truepbr_50_lr1e6-step{step}
      every_n_train_steps: 50
      save_top_k: -1
      save_last: false
      save_weights_only: true
  callbacks: {}
  trainer:
    benchmark: true
    max_epochs: -1
    gradient_clip_val: 1.0
    val_check_interval: 1000
    num_sanity_val_steps: 0
    accumulate_grad_batches: 1
    check_val_every_n_epoch: null
    max_steps: 50
    limit_val_batches: 0
init_control_from: null
resume_from: null
